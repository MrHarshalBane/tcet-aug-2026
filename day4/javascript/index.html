<script>
//CW3: WAP to create random jackpot number and take input from user to guess the number. Based on level, the attempt to guess the number should change
//Medium – 10 attempts

jackpot = 73

for(i = 1; i <= 10; i++) {
    guess = prompt("Guess a number:")
    
    if(jackpot == guess){
        alert("7 crore adbhud")
        break;
    }
    
    if(jackpot > guess){
        alert(`Jackpot is greater than ${guess}`)
    }
    
    if(jackpot < guess){
        alert(`Jackpot is smaller than ${guess}`)
    }
}
